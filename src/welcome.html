<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="welcome.css">
  <title>Karaoke Queue · Configuração inicial</title>
</head>
<body>
  <main class="welcome-shell">
    <header class="welcome-brand"><img src="assets/karaoke-logo.png" alt=""><span>Karaoke Queue</span></header>
    <section class="welcome-content">
      <p class="welcome-kicker">CONFIGURAÇÃO INICIAL</p>
      <h1>Como deseja usar o Karaoke Queue?</h1>
      <p class="welcome-intro">Escolha como este computador será utilizado. Você poderá alterar o modo depois nas Configurações.</p>
      <div class="mode-options" role="radiogroup" aria-label="Modo de operação">
        <button class="mode-card" type="button" role="radio" aria-checked="false" data-mode="controller">
          <span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h3M8 13h3M15 9h1m-1 4h1"/></svg></span>
          <span class="mode-copy"><strong>Controlador</strong><span>Gerencie a fila, as mesas e as sessões. A integração com um Reprodutor em outro computador será disponibilizada em uma etapa futura.</span><small>Ideal para computadores separados para a fila e a reprodução.</small></span>
          <span class="mode-check" aria-hidden="true">✓</span>
        </button>
        <button class="mode-card" type="button" role="radio" aria-checked="false" data-mode="player">
          <span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4m-2-9 5-2.5L10 7z"/></svg></span>
          <span class="mode-copy"><strong>Reprodutor</strong><span>Reproduza vídeos neste computador. Escolha músicas manualmente pelo código; os comandos pela rede serão disponibilizados em uma etapa futura.</span><small>Ideal para o computador conectado à TV ou ao projetor.</small></span>
          <span class="mode-check" aria-hidden="true">✓</span>
        </button>
        <button class="mode-card" type="button" role="radio" aria-checked="false" data-mode="combined">
          <span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="13" height="11" rx="1.5"/><rect x="15.5" y="8" width="6" height="10" rx="1.2"/><path d="M6 19h6m-3-4v4m6-6h1.5"/></svg></span>
          <span class="mode-copy"><strong>Tudo em um</strong><span>Gerencie a fila e reproduza as músicas no mesmo computador. O vídeo abre em uma janela independente para outra tela.</span><small>Ideal para operar o karaokê inteiro com apenas um computador.</small></span>
          <span class="mode-check" aria-hidden="true">✓</span>
        </button>
      </div>
      <div class="welcome-footer">
        <p>O modo escolhido ficará salvo neste computador.</p>
        <div><button id="welcome-cancel" class="welcome-cancel" type="button">Cancelar</button><button id="welcome-continue" class="welcome-continue" type="button" disabled>Continuar</button></div>
      </div>
      <p id="welcome-error" class="welcome-error" role="alert" hidden></p>
    </section>
  </main>
  <script src="welcome-renderer.bundle.js"></script>
</body>
</html>
