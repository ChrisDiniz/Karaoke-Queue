name: Karaoke Queue — PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux compile, unit and Electron E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run unit and workflow configuration tests
        run: |
          npm run test:unit
          npm run test:release-workflow

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install --yes xvfb xauth

      - name: Run Electron E2E suites with isolated profiles
        run: npm run test:e2e:linux

  windows-build:
    name: Windows x64 package and smoke test
    needs: linux-validation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned Windows x64 NSIS installer
        run: npm run build:windows

      - name: Run deterministic F0 Windows regressions with isolated fixtures
        run: npm run test:ci:f0:windows

      - name: Validate native Windows safeStorage and protected remote identity
        run: node scripts/remote-safe-storage-electron.test.cjs

      - name: Verify package contents and metadata
        run: npm run verify:windows-build

      - name: Verify native operation tree and NSIS section ownership with isolated fixtures
        run: node scripts/windows-runtime-mutex-electron.cjs

      - name: Verify role onboarding and media setup with real Electron and SQLite
        run: node build/tests/operating-modes-electron.js

      - name: Read package version
        id: product
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check executable metadata and signature status
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.product.outputs.version }}
        run: |
          $installer = Get-ChildItem dist -Filter "Karaoke-Queue-Setup-$env:EXPECTED_VERSION-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw 'Windows x64 installer is missing.' }
          $version = $installer.VersionInfo
          if ($version.ProductName -ne 'Karaoke Queue') { throw "Unexpected installer product name: $($version.ProductName)" }
          if ($version.ProductVersion -notmatch "^$([regex]::Escape($env:EXPECTED_VERSION))($|\.)") { throw "Unexpected installer version: $($version.ProductVersion)" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          "Installer: $($installer.Name)"
          "Product: $($version.ProductName) $($version.ProductVersion)"
          "Signature status: $($signature.Status)"

      - name: Launch packaged app and verify trial, IPC, SQLite and restart
        run: node tests/packaged-windows-smoke.cjs "dist/win-unpacked/Karaoke Queue.exe"

      - name: Install and uninstall NSIS candidate on disposable hosted runner
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          ./tests/windows-nsis-install-smoke.ps1 -InstallerPath "dist/Karaoke-Queue-Setup-$version-x64.exe"

      - name: Generate checksums and validation manifest
        id: artifact
        shell: pwsh
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Get-Item "dist/Karaoke-Queue-Setup-$version-x64.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Out-File dist/SHA256SUMS.txt -Encoding ascii
          $manifest = [ordered]@{
            format = 1
            event = $env:SOURCE_EVENT
            ref = $env:SOURCE_REF
            sourceSha = $env:SOURCE_SHA
            runId = $env:SOURCE_RUN_ID
            packageVersion = $version
            architecture = 'x64'
            installer = $installer.Name
            installerSha256 = $hash
            packageVerification = 'PASS'
            packagedElectronSmoke = 'PASS'
            nsisInstallUninstallSmoke = 'PASS'
            releasePublished = $false
          }
          $encoding = [System.Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/artifact-manifest.json'), ($manifest | ConvertTo-Json -Depth 4), $encoding)
          if ($env:SOURCE_EVENT -eq 'pull_request') {
            $artifactName = "Karaoke-Queue-PR-$($env:SOURCE_PR_NUMBER)-Windows-x64"
          } else {
            $artifactName = "Karaoke-Queue-Validation-$($env:SOURCE_RUN_ID)-$($env:SOURCE_SHA.Substring(0,12))-Windows-x64"
          }
          "name=$artifactName" >> $env:GITHUB_OUTPUT

      - name: Upload pull request installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            dist/Karaoke-Queue-Setup-${{ steps.product.outputs.version }}-x64.exe
            dist/SHA256SUMS.txt
            dist/artifact-manifest.json
          if-no-files-found: error
          retention-days: 30
